[project]
name = "snapkey-assistant"
version = "0.1.0"
description = "Multi-tenant AI agent SaaS starter"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2.10,<1",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "playwright>=1.52,<2",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agent = ["smolagents>=1.8,<2"]
connector = ["pyodbc>=5.2,<6"]
free-agent = [
  "ollama>=0.5,<1",
  "opencv-python>=4.10,<5",
  "smolagents>=1.8,<2",
]
local-voice = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "pypdf>=5.0,<7",
]
realtime-voice = ["pipecat-ai>=0.0.70,<1"]
desktop = ["pyinstaller>=6.10,<7"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
include = ["app*", "connector*"]
exclude = ["node_modules*", "tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
