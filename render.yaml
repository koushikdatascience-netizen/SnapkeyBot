services:
  - type: web
    name: snapkey-assistant
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snapkey-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: TASK_ALWAYS_EAGER
        value: "true"
      - key: CONCIERGE_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OPERATOR_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

databases:
  - name: snapkey-db
    databaseName: snapkey
    user: snapkey
